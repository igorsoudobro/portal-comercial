<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Comercial · Dobro</title>
<!-- 25/11/2026: o Portal Comercial antigo foi desligado. Esta pagina substitui o index.html do
     repositorio portal-comercial e manda quem tinha o link antigo para o Portal Ao Vivo. -->
<meta http-equiv="refresh" content="4; url=https://igorsoudobro.github.io/portal-comercial-ao-vivo/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--azul:#2A3E7E;--fundo:#F4F6FB;--texto:#1f2a44;--cinza:#5b6475}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--fundo);font-family:Calibri,'Segoe UI',Arial,sans-serif;color:var(--texto);padding:16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(42,62,126,.12);
        padding:36px 32px;max-width:460px;width:100%;text-align:center}
  h1{font-family:'Barlow Condensed',sans-serif;color:var(--azul);font-size:30px;margin:0 0 10px}
  p{color:var(--cinza);font-size:15px;line-height:1.5;margin:0 0 22px}
  a.btn{display:inline-block;background:var(--azul);color:#fff;text-decoration:none;font-weight:700;
        padding:12px 22px;border-radius:10px;font-size:15px}
  small{display:block;margin-top:16px;color:var(--cinza);font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <h1>O Portal Comercial mudou de endereço</h1>
    <p>Agora ele é o <b>Portal Comercial Ao Vivo</b>, com os números do dia. Salve o novo link nos favoritos.</p>
    <a class="btn" href="https://igorsoudobro.github.io/portal-comercial-ao-vivo/">Abrir o Portal Ao Vivo</a>
    <small>Você será levado automaticamente em alguns segundos.</small>
  </div>
</body>
</html>
